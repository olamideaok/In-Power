<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>In Power — Story Mode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B1E3D; --ink-2:#122a52; --parchment:#F2ECDD; --parchment-2:#e8e0cb;
    --gold:#C9A227; --gold-2:#e0bb45; --red:#B23A2F; --green:#2F6E5B; --blue:#2E5C8A;
    --accent: var(--gold); --accent-2: var(--gold-2); --text-ink:#1c2536; --radius: 4px;
  }
  body.country-ng{ --accent: var(--green); --accent-2:#3d8d75; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--ink);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(201,162,39,0.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(201,162,39,0.08), transparent 45%),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 26px);
    color: var(--parchment); font-family:'Source Serif 4', serif; min-height:100vh;
    display:flex; align-items:flex-start; justify-content:center; padding: 28px 14px 60px;
    transition: background 0.6s ease;
  }
  .frame{ width:100%; max-width:800px; }
  .masthead{ display:flex; align-items:baseline; justify-content:space-between; border-bottom: 2px solid var(--accent); padding-bottom:10px; margin-bottom:18px; }
  .masthead h1{ font-family:'Oswald',sans-serif; font-weight:700; letter-spacing:2px; font-size:30px; margin:0; text-transform:uppercase; color: var(--parchment); }
  .masthead h1 span{ color: var(--accent); }
  .masthead .tag{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:1.5px; color:#9fb0cc; text-transform:uppercase; }
  .hud{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; font-family:'IBM Plex Mono',monospace; font-size:11px; }
  .hud .chip{ border:1px solid rgba(242,236,221,0.25); padding:5px 10px; border-radius:2px; letter-spacing:0.5px; color:#cfd9ee; background:rgba(255,255,255,0.03); }
  .hud .chip b{ color: var(--accent-2); }
  .card{ background: var(--parchment); color: var(--text-ink); border-radius: var(--radius); padding: 28px 28px 24px; box-shadow: 0 18px 50px rgba(0,0,0,0.45), 0 2px 0 var(--accent) inset; position:relative; animation: rise 0.4s ease; }

  .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:2px; text-transform:uppercase; color: var(--red); margin-bottom:8px; display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  h2.title{ font-family:'Oswald',sans-serif; font-size:25px; margin:0 0 12px; line-height:1.15; text-transform:uppercase; letter-spacing:0.5px; }
  p.lede{ font-size:15.5px; line-height:1.5; color:#3a3428; margin:0 0 18px; }
  .btn-grid{ display:grid; gap:10px; }
  .btn{ font-family:'Oswald',sans-serif; font-size:15px; letter-spacing:0.4px; text-transform:uppercase; background: var(--ink); color: var(--parchment); border:none; padding:14px 18px; border-radius:2px; cursor:pointer; text-align:left; display:flex; justify-content:space-between; align-items:center; transition: transform 0.12s ease, background 0.15s ease; border-left: 4px solid var(--accent); }
  .btn:hover{ background: var(--ink-2); transform: translateX(3px); }
  .btn:active{ transform: translateX(1px) scale(0.99); }
  .btn small{ font-family:'IBM Plex Mono',monospace; font-size:11px; opacity:0.65; text-transform:none;}
  .btn.gold{ background: var(--accent); color: var(--ink); border-left-color: var(--ink);}
  .btn.gold:hover{ background: var(--accent-2); }
  .btn.outline{ background:transparent; color: var(--text-ink); border:1px solid #c9c2ab; border-left:4px solid var(--accent);}
  .btn.outline:hover{ background:rgba(0,0,0,0.04); }
  .zone-block{ margin-bottom:14px; }
  .zone-head{ display:flex; align-items:center; gap:8px; font-family:'Oswald',sans-serif; font-size:13px; text-transform:uppercase; letter-spacing:1px; color:#5c5340; margin-bottom:6px; padding:4px 8px; border-radius:2px; background: var(--zonecolor,#ded4b6); }

  .map-scroll{ max-height:390px; overflow-y:auto; padding-right:4px; margin-bottom:10px; }
  .progress-row{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .progress-track{ flex:1; height:7px; background:#ddd5bd; border-radius:4px; overflow:hidden; }
  .progress-fill{ height:100%; background: var(--red); transition: width 0.35s ease; }
  .qnum{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:#7a705a; white-space:nowrap; }
  .question-text{ font-family:'Oswald',sans-serif; font-size:20px; line-height:1.3; margin: 4px 0 18px; color:#1c2536; }
  .hard-tag{ display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:1px; text-transform:uppercase; background: var(--red); color:#fff; padding:3px 8px; border-radius:10px; margin-bottom:8px; }
  .cat-tag{ display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:1px; text-transform:uppercase; background:#e4dcc2; color:#5c5340; padding:3px 8px; border-radius:10px; margin-bottom:8px; margin-right:6px; }
  .choices{ display:grid; gap:10px; }
  .choice{ text-align:left; padding:13px 16px; border-radius:2px; border:1.5px solid #cfc6ab; background:#fbf8f0; font-family:'Source Serif 4',serif; font-size:15.5px; cursor:pointer; color:#2a2418; display:flex; gap:12px; align-items:flex-start; transition: all .12s ease; }
  .choice .letter{ font-family:'IBM Plex Mono',monospace; font-weight:600; color: var(--accent); border:1px solid var(--accent); width:22px;height:22px;min-width:22px; border-radius:50%; display:flex;align-items:center;justify-content:center; font-size:12px; }

  .bar-track{ flex:1; height:16px; background:#ddd5bd; border-radius:8px; overflow:hidden; }

  .weight-note{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:#7a705a; margin: -8px 0 16px; line-height:1.5; }
  .incident-tag{ display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:1px; text-transform:uppercase; background: var(--ink); color: var(--gold-2); padding:4px 9px; border-radius:2px; margin-bottom:10px; }

  .xp-fill{ height:100%; background: var(--green); transition: width 0.6s ease; }

  .footer-links{ text-align:center; margin-top:16px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:#6f7fa0; }
  .footer-links a{ color:#9fb0cc; cursor:pointer; text-decoration:underline; }
  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:#c9c2ab; border-radius:4px; }
  /* ---------- Dialogue / storytelling UI ---------- */
  .dlg-wrap{ display:flex; flex-direction:column; gap:14px; margin-bottom:6px; }
  .dlg-line{ display:flex; gap:12px; align-items:flex-start; animation: dlgIn 0.3s ease; }
  @keyframes dlgIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .dlg-avatar{ width:44px; height:44px; min-width:44px; border-radius:50%; background: var(--ink); display:flex; align-items:center; justify-content:center; font-size:22px; box-shadow: 0 2px 0 var(--accent) inset; overflow:hidden; position:relative; }
  .dlg-avatar .avatar-img{ width:100%; height:100%; object-fit:cover; border-radius:50%; display:block; }
  .dlg-avatar .avatar-emoji{ display:none; width:100%; height:100%; align-items:center; justify-content:center; font-size:22px; }
  .dlg-bubble{ background:#fbf8f0; border:1px solid #cfc6ab; border-radius:10px; padding:12px 16px; flex:1; }
  .dlg-name{ font-family:'Oswald',sans-serif; font-size:12.5px; text-transform:uppercase; letter-spacing:1px; color: var(--red); margin-bottom:4px; }

    .dlg-avatar{ width:36px; height:36px; min-width:36px; } .dlg-avatar .avatar-emoji{ font-size:18px; }

  @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.001s !important; transition-duration:0.001s !important; } }

</head>

<canvas id="confetti"></canvas>
<div class="frame">
  <div class="masthead">
    <h1>IN <span>POWER</span></h1>
    <div class="tag" id="hudTag">🗳️ Campaign Simulator v2.2</div>
  </div>
  <div class="hud" id="hud"></div>
  <div class="card" id="card"></div>
  <div class="footer-links" id="footerLinks"></div>

<script>
/* ============================================================================
   IN POWER — STORY MODE
   ----------------------------------------------------------------------------
   HOW THIS FILE IS ORGANIZED (read this if you want to edit/add content):

   1. HELPERS                  — generic utility functions, don't touch lightly
   2. US STATE DATA             — one entry per US state (facts[] data), plus
                                   the hand-authored US STATE question bank (2b)
   3. NIGERIA STATE DATA        — one entry per NG state (3a), all 774 LGAs (3b),
                                   the hand-authored LOCAL question bank (3c),
                                   and the hand-authored NG STATE bank (3d)
   4. NATIONAL QUESTION BANK    — Tier 3. General-knowledge Qs, country-wide.
   5. POP-CULTURE INTRO BANK    — light Qs used in the opening story scene
                                   (NOT part of the 3-tier race system below)
   6. INCIDENT BANKS            — "in office" scenario trivia, by tier & country
   7. CHARACTERS & DIALOGUE     — the story: who talks, and what they say
   8. QUESTION POOL GENERATORS  — combines the 3 tiers into a 20-Q quiz per race
   9. GAME STATE & SCORING      — the G object, and how elections are weighted
  10. SCREENS                   — every UI screen, in the order the player sees them
  11. CONFETTI + INIT

   ----------------------------------------------------------------------------
   THE THREE QUESTION-POOL TIERS (see section 8 for exactly how they combine):

     TIER 1 — LOCAL    Hand-authored, keyed by exact locality (an LGA in
                        Nigeria, or a state's largest city in the US). Lives in
                        section 3c (NG) / alongside it (US, near section 2).
                        Only a handful of localities are filled in today as a
                        starting example — any locality without an entry just
                        contributes nothing and the quiz gracefully falls back
                        to Tier 2. Safe to leave 99% of Nigeria's 774 LGAs
                        empty; the infrastructure supports filling in the rest
                        at any time without touching any other code.
     TIER 2 — STATE     TWO sources, both automatically combined by
                        stateTierPool() in section 8A:
                          (a) Auto-generated from facts[] (section 2/3a) plus
                              structural trivia (capital, zone, statehood
                              year) — no authoring needed, just add a fact
                              string and a question appears on its own.
                          (b) Hand-authored, exact questions you write
                              yourself with your own wrong answers — see
                              STATE_QUESTION_BANK_US (section 2b) and
                              STATE_QUESTION_BANK_NG (section 3d).
     TIER 3 — NATIONAL  One flat bank per country (section 4). Country-wide
                        trivia, used mainly for President races.

     RACE COMPOSITION RULES (implemented in buildLocalRaceQuiz /
     buildGovernorRaceQuiz / buildPresidentRaceQuiz in section 8):
       • Local race     → TIER 1 (this exact locality)  + TIER 2 (this state)
       • Governor race  → TIER 2 (this state)  + TIER 1 (every locality
                           inside this state that has content)
       • President race → TIER 3 (national)  + TIER 2 (sampled across many
                           states)  + TIER 1 (1–2 questions sampled from
                           anywhere in the country, if any exist)

   TO ADD A NEW STATE FACT:      go to section 2 or 3a, add a string to that
                                  state's facts[] array. The game auto-writes
                                  a question from it. It will ONLY ever be
                                  asked about that state — never mixed elsewhere.
   TO HAND-WRITE A STATE Q:      go to section 2b (US) / 3d (NG), add a row
                                  to STATE_QUESTION_BANK_US / _NG — same
                                  [question, correct, [wrongs]] format as
                                  Local and National. Use this when you want
                                  exact control over the wrong answers.
   TO ADD LOCAL (LGA/CITY) Qs:   go to section 3c, add an entry to
                                  LOCAL_QUESTION_BANK_NG / _US. See that
                                  section's own header for the exact format.
   TO ADD A NATIONAL TRIVIA Q:   go to section 4, add a row (only used for
                                  President races).
   TO ADD AN INCIDENT:            go to section 6, add a row to the matching
                                  tier + country bank.
   TO EDIT THE STORY:             go to section 7 — every line of dialogue in
                                  the game lives there, in plain arrays.
   ============================================================================ */

/* ============================================================================
   1. HELPERS
   ============================================================================ */
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function sampleN(arr,n){ return shuffle(arr).slice(0,n); }
function distractors(pool, correct, field, n){
  const vals = [...new Set(pool.filter(s=>s[field]!==correct).map(s=>s[field]))];
  return sampleN(vals,n);
}
// mkQ builds one standardized question object: {q, choices[4 or 2], answer, cat, hard}
function mkQ(text, correct, wrongs, cat, hard){
  const choices = shuffle([correct, ...wrongs]);
  return { q:text, choices, answer: choices.indexOf(correct), cat: cat||'General', hard: !!hard };
}
// rowToQ turns a plain [question, correctAnswer, [wrong1,wrong2,wrong3]] data
// row — the format used by EVERY question bank in this file (Tier 1, Tier 3,
// pop-culture, incidents) — into a question object via mkQ. Use this instead
// of calling mkQ directly when reading straight out of a bank array.
function rowToQ(row, cat, hard){ return mkQ(row[0], row[1], row[2], cat, hard===undefined ? row[3] : hard); }

   ============================================================================ */

// Returns the hand-authored Tier 1 questions for one exact locality (or an
// empty array if that locality hasn't been filled in yet — always safe).
function localQuestionsAt(country, stateName, locality){
  if(!locality) return [];
  const bank = country==='us' ? LOCAL_QUESTION_BANK_US : LOCAL_QUESTION_BANK_NG;
  return bank[localKey(stateName, locality)] || [];
}
// Returns every filled-in Tier 1 entry belonging to ANY locality inside a
// given state — used by Governor races ("all the local government questions").
function localQuestionsForState(country, stateName){
  const bank = country==='us' ? LOCAL_QUESTION_BANK_US : LOCAL_QUESTION_BANK_NG;
  return Object.keys(bank).filter(k=>k.startsWith(stateName+'::')).flatMap(k=>bank[k]);
}

    const wrongLgas = sampleN(otherStates,3).map(s=> pick((NG_LGAS[s.name]||[s.capital])) );

/* ============================================================================
   8. QUESTION POOL GENERATORS
   Turns the raw data in sections 2–5 into ready-to-play 20-question quizzes.
   This section has two halves:
     A) STATE-TIER (Tier 2) GENERATORS — auto-build state-level trivia from
        the data in sections 2/3a. No per-state authoring needed.
     B) COMPOSERS — combine Tier 1 (section 3c) + Tier 2 (part A below) +
        Tier 3 (section 4) into the actual 20-question quiz for each race
        type. THIS is the part to edit if you want to change what mix of
        tiers a given race pulls from.
   ============================================================================ */

/* ---- 8A. STATE-TIER (Tier 2) GENERATORS ---- */
function factsPoolOf(all){ return all.flatMap(s=>s.facts.map(f=>({owner:s.name, text:f}))); }

function factForwardQs(state, pool, nameLabel){
  const own = state.facts;
  if(own.length===0) return [];
  const n = Math.min(2, own.length);
  const usedIdx = sampleN(own.map((_,i)=>i), n);
  return usedIdx.map(i=>{
    const correct = own[i];
    const wrongs = sampleN(pool.filter(f=>f.owner!==state.name), 3).map(f=>f.text);
    return mkQ(`Which of these is true about ${nameLabel}?`, correct, wrongs, 'History & Culture');
  });
}
function factBooleanQs(state, pool, nameLabel){
  const ownItems = pool.filter(f=>f.owner===state.name);
  const otherItems = sampleN(pool.filter(f=>f.owner!==state.name), 8);
  const items = shuffle([...ownItems, ...otherItems]).slice(0,9);
  return items.map(item=>{
    const truth = item.owner===state.name ? "True" : "False";
    return mkQ(`True or False, about ${nameLabel}: "${item.text}"`, truth, [truth==="True"?"False":"True"], 'History & Culture', true);
  });
}
function usStateStructuralQs(state, all){
  const pool = [];
  pool.push(mkQ(`What is the capital of ${state.name}?`, state.capital, distractors(all,state.capital,'capital',3), 'Government'));
  pool.push(mkQ(`${state.capital} is the capital of which state?`, state.name, distractors(all,state.name,'name',3), 'Government'));
  pool.push(mkQ(`Which nickname belongs to ${state.name}?`, state.nickname, distractors(all,state.nickname,'nickname',3), 'Culture'));
  pool.push(mkQ(`What is the largest city in ${state.name}?`, state.largestCity, distractors(all,state.largestCity,'largestCity',3), 'Geography'));
  pool.push(mkQ(`In what year did ${state.name} become a U.S. state?`, String(state.year), distractors(all,state.year,'year',3).map(String), 'History'));
  pool.push(mkQ(`Which U.S. Census region is ${state.name} located in?`, state.region, US_REGIONS.filter(r=>r!==state.region), 'Geography'));
  const sameRegion = all.filter(s=>s.region===state.region && s.name!==state.name);
  if(sameRegion.length>0){
    const correct = pick(sameRegion);
    const wrongPool = all.filter(s=>s.region!==state.region);
    pool.push(mkQ(`Which of these states shares ${state.name}'s region (${state.region})?`, correct.name, sampleN(wrongPool,3).map(s=>s.name), 'Geography'));
  }
  shuffle(all.filter(s=>s.name!==state.name)).slice(0,4).forEach(o=>{
    const truth = o.region===state.region ? "True" : "False";
    pool.push(mkQ(`True or False: ${o.name} is in the same Census region as ${state.name}.`, truth, [truth==="True"?"False":"True"], 'Geography'));
  });
  shuffle(all.filter(s=>s.name!==state.name)).slice(0,4).forEach(o=>{
    const truth = o.year < state.year ? "True" : "False";
    pool.push(mkQ(`True or False: ${o.name} became a state before ${state.name}.`, truth, [truth==="True"?"False":"True"], 'History'));
  });
  const seen = new Set(); const unique = [];
  for(const item of pool){ if(!seen.has(item.q)){ seen.add(item.q); unique.push(item); } }
  return unique;
}
function ngStateStructuralQs(state, all){
  const pool = [];
  const isFCT = state.name === 'Federal Capital Territory';
  const stateLabel = isFCT ? state.name : (state.name+' State');
  if(!isFCT){
    pool.push(mkQ(`What is the capital of ${state.name} State?`, state.capital, distractors(all,state.capital,'capital',3), 'Government'));
    pool.push(mkQ(`${state.capital} is the capital of which Nigerian state?`, state.name, distractors(all,state.name,'name',3), 'Government'));
    pool.push(mkQ(`In what year was ${state.name} State created?`, String(state.creationYear), distractors(all,state.creationYear,'creationYear',3).map(String), 'Government & History'));
    shuffle(all.filter(s=>s.name!==state.name)).slice(0,4).forEach(o=>{
      const truth = o.creationYear < state.creationYear ? "True" : "False";
      pool.push(mkQ(`True or False: ${o.name} State was created before ${state.name} State.`, truth, [truth==="True"?"False":"True"], 'Government & History'));
    });
  }
  pool.push(mkQ(`Which geopolitical zone is ${stateLabel} located in?`, state.zone, NG_ZONES.filter(z=>z!==state.zone), 'Geography'));
  const coastalTruth = NG_COASTAL.includes(state.name) ? "True" : "False";
  pool.push(mkQ(`True or False: ${stateLabel} has an Atlantic coastline.`, coastalTruth, [coastalTruth==="True"?"False":"True"], 'Geography'));
  const zoneMates = all.filter(s=>s.zone===state.zone && s.name!==state.name);
  if(zoneMates.length>0){
    const correct = pick(zoneMates);
    const wrongPool = all.filter(s=>s.zone!==state.zone);
    pool.push(mkQ(`Which of these states is in the same geopolitical zone as ${state.name} (${state.zone})?`, correct.name, sampleN(wrongPool,3).map(s=>s.name), 'Geography'));
  }
  shuffle(all.filter(s=>s.name!==state.name)).slice(0,4).forEach(o=>{
    const truth = o.zone===state.zone ? "True" : "False";
    pool.push(mkQ(`True or False: ${o.name} State is in the same geopolitical zone as ${stateLabel}.`, truth, [truth==="True"?"False":"True"], 'Geography'));
  });
  const seen = new Set(); const unique = [];
  for(const item of pool){ if(!seen.has(item.q)){ seen.add(item.q); unique.push(item); } }
  return unique;
}
// Hand-authored Tier 2 questions for one state (from STATE_QUESTION_BANK_US
// / _NG in sections 2b / 3d) — empty array if that state has none defined.
function handAuthoredStateQuestions(country, stateName){
  const bank = country==='us' ? STATE_QUESTION_BANK_US : STATE_QUESTION_BANK_NG;
  return (bank[stateName] || []).map(r=>rowToQ(r,'State Trivia'));
}
// The full Tier 2 (STATE) pool for one state: hand-authored Qs (2b/3d) +
// auto-generated facts[] questions + structural trivia. Used directly by
// every race type (Local, Governor, President all draw on their state's
// Tier 2 pool — see the composers below).
function stateTierPool(country, state, all){
  const isUS = country==='us';
  const label = isUS ? state.name : (state.name+' State');
  const factPool = isUS ? factsPoolOf(US_STATES) : factsPoolOf(NG_STATES);
  const facts = [...factForwardQs(state,factPool,label), ...factBooleanQs(state,factPool,label)];
  const structural = isUS ? usStateStructuralQs(state, all) : ngStateStructuralQs(state, all);
  const handAuthored = handAuthoredStateQuestions(country, state.name);
  const seen = new Set(); const unique = [];
  for(const item of [...handAuthored, ...facts, ...structural]){ if(!seen.has(item.q)){ seen.add(item.q); unique.push(item); } }
  return unique;
}

/* ---- 8B. COMPOSERS — combine Tier 1 + Tier 2 + Tier 3 into a 20-Q quiz ---- */
// Merges a "guaranteed" pool (always included, e.g. Tier 1 local content —
// there's so little of it that we always want to show it) with a "fill" pool
// (used to pad out to 20 questions), de-duplicating by question text.
function composeQuiz(guaranteedPool, fillPool, targetCount=20){
  const seen = new Set(); const guaranteed = [];
  for(const item of shuffle(guaranteedPool)){ if(item && !seen.has(item.q)){ seen.add(item.q); guaranteed.push(item); } }
  const fill = [];
  for(const item of shuffle(fillPool)){ if(item && !seen.has(item.q)){ seen.add(item.q); fill.push(item); } }
  return shuffle([...guaranteed, ...fill.slice(0, Math.max(0,targetCount-guaranteed.length))]);
}
// LOCAL RACE → Tier 1 (this exact locality, hand-authored + auto-generated
// identity Qs) is guaranteed; Tier 2 (this state) fills the rest.
function buildLocalRaceQuiz(country, stateObj, locality, all){
  const localHandAuthored = localQuestionsAt(country, stateObj.name, locality).map(r=>rowToQ(r,'Local Government'));
  const localAutoGenerated = country==='ng' ? autoLocalIdentityQuestions(stateObj, locality, all) : [];
  const guaranteed = [...localHandAuthored, ...localAutoGenerated];
  const fill = stateTierPool(country, stateObj, all);
  return composeQuiz(guaranteed, fill).slice(0,20);
}
// GOVERNOR RACE → Tier 2 (this state) fills most of it; Tier 1 questions from
// EVERY locality inside this state are guaranteed in ("all the local
// government questions").
function buildGovernorRaceQuiz(country, stateObj, all){
  const guaranteed = localQuestionsForState(country, stateObj.name).map(r=>rowToQ(r,'Local Government'));
  const fill = stateTierPool(country, stateObj, all);
  return composeQuiz(guaranteed, fill).slice(0,20);
}
// PRESIDENT RACE → Tier 3 (national bank) is guaranteed, plus 1-2 Tier 1
// questions sampled from anywhere in the country; Tier 2 questions sampled
// across many different states fill out the rest.
function buildPresidentRaceQuiz(country, all){
  const nationalBank = country==='us' ? NATIONAL_QUESTION_BANK_US : NATIONAL_QUESTION_BANK_NG;
  const nationalQs = sampleN(nationalBank,5).map(r=>rowToQ(r,'National History & Government',true));
  const localPools = allLocalPoolsNationwide(country);
  const localQs = localPools.length ? sampleN(localPools, Math.min(2,localPools.length)).map(arr=>rowToQ(pick(arr),'Local Government')) : [];
  const guaranteed = [...nationalQs, ...localQs];
  const chosenStates = sampleN(all, 15);
  const fill = chosenStates.map(st=> pick(stateTierPool(country, st, all)) );
  return composeQuiz(guaranteed, fill).slice(0,20);
}

        introDone:false, introCharisma:0, seenTierIntro:{local:false,governor:false,president:false},
        _dlgLines:[], _dlgIdx:0, _dlgOnDone:null, _popQuestions:[], _popIndex:0 };
  document.body.classList.remove('country-ng');
  screenMenu();
}

/* ---------- Generic dialogue engine (used for every story beat) ---------- */
function screenDialogue(lines, onDone){
  G._dlgLines = lines; G._dlgIdx = 0; G._dlgOnDone = onDone;
  renderDialogueStep();
}
function renderDialogueStep(){
  renderHud();

  const person = CHARACTERS[G.country][line.who];
  card.innerHTML = `
    <div class="eyebrow"><span>📖 STORY</span><span>${countryFlag()} ${countryLabel().toUpperCase()}</span></div>

        ${avatarHtml(person)}
        <div class="dlg-bubble">
          <div class="dlg-name">${person.name}</div>
          <div class="dlg-text">${line.text}</div>
        </div>
      </div>
    </div>
    <div class="dlg-controls"><button class="btn gold" style="display:inline-flex;width:auto;" onclick="dialogueNext()">Continue →</button></div>
  `;
}
function dialogueNext(){
  G._dlgIdx++;
  if(G._dlgIdx>=G._dlgLines.length){ const done=G._dlgOnDone; G._dlgOnDone=null; done && done(); }
  else { renderDialogueStep(); }
}

/* ---------- Screen 0: main menu ---------- */
function screenMenu(){
  G.country=null; G.office=null; G.stateObj=null;
  renderHud(); footerLinks.innerHTML='';
  card.innerHTML = `
    <div class="eyebrow"><span>🗳️ WELCOME</span><span>IN POWER v2.2</span></div>
    <h2 class="title">Choose your country</h2>

    <div class="btn-grid">
      <button class="btn gold" onclick="chooseCountry('us')">🇺🇸 United States <small>50 states</small></button>
      <button class="btn gold" onclick="chooseCountry('ng')">🇳🇬 Nigeria <small>36 states + FCT · all 774 LGAs</small></button>
    </div>
  `;
}
function chooseCountry(c){
  G.country=c; setBodyCountry();
  if(!G.introDone){ introStep1(); } else { screenOfficeSelect(); }
}

/* ---------- Opening story sequence ---------- */
function introStep1(){ screenDialogue(introLinesPart1(G.country), introPopQuiz); }
function introPopQuiz(){
  const bank = G.country==='us' ? POP_INTRO_US : POP_INTRO_NG;
  G._popQuestions = sampleN(bank,5).map(r=>mkQ(r[0],r[1],r[2],'Pop Culture'));

}
function screenPopQuestion(){

    </div>
    <div class="choices" id="popChoicesWrap">
      ${q.choices.map((c,i)=>`<button class="choice" data-i="${i}" onclick="answerPopQuestion(${i})"><span class="letter">${letters[i]}</span><span>${c}</span></button>`).join('')}
    </div>
    <div id="popFeedback"></div>
  `;
}
function answerPopQuestion(i){
  const total = G._popQuestions.length;

  buttons.forEach(b=>b.disabled=true);

    <div class="feedback-banner">${right?'✅ Nice!':'❌ Close! Correct answer: '+q.choices[q.answer]}</div>
    <div class="next-row"><button class="btn gold" style="display:inline-flex;width:auto;" onclick="nextPopQuestion()">${G._popIndex+1<total?'Next →':'Continue →'}</button></div>
  `;
}
function nextPopQuestion(){
  G._popIndex++;
  if(G._popIndex>=G._popQuestions.length){ introStep2(); } else { screenPopQuestion(); }
}
function introStep2(){ screenDialogue(introLinesPart2(G.country), screenCoordinatorChoice); }
function screenCoordinatorChoice(){
  renderHud();
  const c = CHARACTERS[G.country].coordinator;
  card.innerHTML = `
    <div class="eyebrow"><span>📖 STORY</span><span>${countryFlag()} ${countryLabel().toUpperCase()}</span></div>
    <div class="dlg-line" style="margin-bottom:18px;">
      ${avatarHtml(c)}

    </div>
    <div class="btn-grid">
      <button class="btn gold" onclick="acceptCoordinator()">🖋️ I'm ready to run</button>
      <button class="btn outline" onclick="askCoordinatorMore()">🤔 Tell me more first</button>
    </div>
  `;
}
function askCoordinatorMore(){ screenDialogue([coordinatorMoreLine(G.country)], screenCoordinatorChoice); }
function acceptCoordinator(){
  G.introDone = true;
  G.experience = G.introCharisma; // charisma earned in the opening scene seeds your first campaign
  screenOfficeSelect();
}

/* ---------- Office & region selection ---------- */
function screenOfficeSelect(){
  renderHud();
  const localLabel = officeLabel('local', G.country);
  const localSub = G.country==='ng' ? 'Pick any of Nigeria\'s 774 LGAs' : '20 region-specific questions';
  card.innerHTML = `
    <div class="eyebrow"><span>${countryFlag()} ${countryLabel().toUpperCase()}</span><span>CHOOSE YOUR RACE</span></div>
    <h2 class="title">Where do you start?</h2>
    <p class="lede">${CHARACTERS[G.country].coordinator.name} suggests starting local — but the choice is yours.</p>
    <div class="btn-grid">
      <button class="btn gold" onclick="chooseOffice('local')">🏘️ Run for ${localLabel} <small>${localSub}</small></button>
      <button class="btn" onclick="chooseOffice('governor')">🏛️ Run for Governor <small>20 region-specific questions</small></button>
      <button class="btn" onclick="chooseOffice('president')">🎖️ Run for President <small>20 questions from across the nation</small></button>
    </div>
  `;
}
function chooseOffice(tier){
  G.office = tier;
  if(tier==='president'){ tierIntroThenStart('president', null); }
  else { screenStatePick(); }
}
function screenStatePick(){
  renderHud();
  const fullList = G.country==='us' ? US_STATES : NG_STATES;
  // The FCT has no elected governor, so it's excluded from Governor races —
  // but it's still fully playable at the Local (Area Council) tier below.
  const list = (G.country==='ng' && G.office==='governor') ? fullList.filter(s=>!s.noGovernor) : fullList;
  const meta = G.country==='us' ? US_REGION_META : NG_ZONE_META;
  const key = G.country==='us' ? 'region' : 'zone';
  const groups = {};
  list.forEach(s=>{ (groups[s[key]] = groups[s[key]]||[]).push(s); });
  const order = G.country==='us' ? US_REGIONS : NG_ZONES;
  const blocks = order.filter(zone=>groups[zone] && groups[zone].length).map(zone=>{
    const m = meta[zone] || {emoji:'📍',color:'#ded4b6'};
    const items = groups[zone].map(s=>`<button onclick='pickState("${s.name.replace(/'/g,"\\'")}")'>${s.name}${s.noGovernor?' 🏛️':''}</button>`).join('');
    return `<div class="zone-block"><div class="zone-head" style="--zonecolor:${m.color}">${m.emoji} ${zone}</div><div class="state-grid">${items}</div></div>`;
  }).join('');
  const noteLine = (G.country==='ng' && G.office==='local') ? "Every state's capital and the FCT's Area Councils are on the map — pick a state (or the FCT) first, then your exact LGA." : "Every question in this race is specific to your chosen region — its history, government, and culture.";
  card.innerHTML = `
    <div class="eyebrow"><span>${countryFlag()} ${countryLabel().toUpperCase()}</span><span>${officeLabel(G.office,G.country).toUpperCase()}</span></div>
    <h2 class="title">🗺️ Pick your region</h2>
    <p class="lede">${noteLine}</p>
    <div class="map-scroll">${blocks}</div>
    <div class="btn-grid"><button class="btn outline" onclick="screenOfficeSelect()">◀ Back</button></div>
  `;
}
function pickState(name){
  const list = G.country==='us' ? US_STATES : NG_STATES;
  const stateObj = list.find(s=>s.name===name);
  if(G.country==='ng' && G.office==='local'){ screenLgaPick(stateObj); }
  else { G.lga = null; tierIntroThenStart(G.office, stateObj); }
}

/* ---------- LGA picker (Nigeria, Local tier only) — all 774 playable ---------- */
function screenLgaPick(stateObj){
  renderHud();
  const lgas = (NG_LGAS[stateObj.name] || []).slice().sort();
  const isFCT = stateObj.name === 'Federal Capital Territory';
  const items = lgas.map(l=>`<button data-name="${l.toLowerCase()}" onclick='pickLga("${stateObj.name.replace(/'/g,"\\'")}","${l.replace(/'/g,"\\'")}")'>${l}</button>`).join('');
  card.innerHTML = `
    <div class="eyebrow"><span>${countryFlag()} ${countryLabel().toUpperCase()}</span><span>${officeLabel('local',G.country).toUpperCase()}</span></div>
    <h2 class="title">🏘️ Pick your ${isFCT?'Area Council':'Local Government Area'}</h2>
    <p class="lede">${stateObj.name}${isFCT?'':' State'} has ${lgas.length} ${isFCT?'Area Councils':'LGAs'}. All 774 across Nigeria are playable — search or scroll to find yours.</p>
    <input type="text" id="lgaSearch" placeholder="Search LGAs in ${stateObj.name}..." oninput="filterLgaGrid(this.value)" style="width:100%;padding:11px 12px;margin-bottom:10px;border:1px solid #c9c2ab;border-radius:2px;font-family:'IBM Plex Mono',monospace;font-size:13px;background:#fbf8f0;color:#2a2418;">
    <div class="map-scroll"><div class="state-grid" id="lgaGrid">${items}</div></div>
    <div class="btn-grid"><button class="btn outline" onclick="screenStatePick()">◀ Back to states</button></div>
  `;
  document.getElementById('lgaSearch').focus();
}
function filterLgaGrid(q){
  const query = q.trim().toLowerCase();
  document.querySelectorAll('#lgaGrid button').forEach(b=>{
    b.style.display = b.dataset.name.includes(query) ? '' : 'none';
  });
}
function pickLga(stateName, lgaName){
  const stateObj = NG_STATES.find(s=>s.name===stateName);
  G.lga = lgaName;
  tierIntroThenStart('local', stateObj);
}

/* ---------- Per-tier campaign-trail dialogue, then the quiz ---------- */
function tierIntroThenStart(tier, stateObj){
  const country = G.country;
  const localityLabel = stateObj ? localityOf(country, stateObj, tier==='local'?G.lga:null) : '';
  const stateLabel = stateObj ? stateObj.name : '';
  const firstTime = !G.seenTierIntro[tier];
  const lines = [...tierIntroLines(country, tier, localityLabel, stateLabel, firstTime), rivalIntroLine(country, tier)];
  G.seenTierIntro[tier] = true;
  screenDialogue(lines, ()=> startElection(tier, stateObj));
}
function startElection(tier, stateObj){
  G.office = tier; G.stateObj = stateObj;
  const all = G.country==='us' ? US_STATES : NG_STATES;
  if(tier==='president'){ G.questions = buildPresidentRaceQuiz(G.country, all); }
  else if(tier==='local'){
    const locality = localityOf(G.country, stateObj, G.lga);
    G.questions = buildLocalRaceQuiz(G.country, stateObj, locality, all);
  } else {
    G.questions = buildGovernorRaceQuiz(G.country, stateObj, all);
  }
  G.qIndex = 0; G.correct = 0;
  renderHud(); screenQuestion();
}

/* ---------- Election quiz ---------- */
function screenQuestion(){
  renderHud();
  const total = G.questions.length;
  const q = G.questions[G.qIndex];
  const pct = Math.round((G.qIndex/total)*100);
  const letters = ['A','B','C','D'];
  const header = G.office==='president' ? '🎖️ NATIONAL CAMPAIGN' : `🏛️ CAMPAIGN · ${G.stateObj.name}`;
  card.innerHTML = `
    <div class="eyebrow"><span>${header.toUpperCase()}</span><span>ISSUE ${String(G.qIndex+1).padStart(2,'0')}/${total}</span></div>
    <div class="progress-row">
      <div class="qnum">${G.qIndex}/${total} answered</div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    ${q.hard?'<span class="hard-tag">🔥 Hard</span>':''}<span class="cat-tag">${q.cat}</span>
    <div class="question-text">${q.q}</div>
    <div class="choices" id="choicesWrap">
      ${q.choices.map((c,i)=>`<button class="choice" data-i="${i}" onclick="answerQuestion(${i})"><span class="letter">${letters[i]}</span><span>${c}</span></button>`).join('')}
    </div>
    <div id="feedbackArea"></div>
  `;
}
function answerQuestion(i){
  const q = G.questions[G.qIndex];
  const buttons = document.querySelectorAll('#choicesWrap .choice');
  buttons.forEach(b=>b.disabled=true);
  const correctI = q.answer;
  buttons[correctI].classList.add('correct');
  if(i!==correctI) buttons[i].classList.add('wrong');
  const isRight = i===correctI;
  if(isRight) G.correct++;
  document.getElementById('feedbackArea').innerHTML = `
    <div class="feedback-banner">${isRight?'✅ Correct.':'❌ Not quite. Correct answer: '+q.choices[correctI]}</div>
    <div class="next-row"><button class="btn gold" style="display:inline-flex;width:auto;" onclick="nextQuestion()">${G.qIndex+1<G.questions.length?'Next issue →':'See results →'}</button></div>
  `;
}
function nextQuestion(){
  G.qIndex++;
  if(G.qIndex>=G.questions.length){ runElectionResult(); } else { screenQuestion(); }
}

/* ---------- Election result ---------- */
function runElectionResult(){
  const w = WEIGHTS[G.office];
  const triviaScore = (G.correct/G.questions.length)*100;
  const expBonus = Math.min(G.experience,100)*w.exp;
  const playerTotal = triviaScore*w.trivia + expBonus;
  const oppTotal = w.oppMin + Math.random()*(w.oppMax-w.oppMin);
  let youShare = (playerTotal/(playerTotal+oppTotal))*100;
  youShare = Math.max(6, Math.min(94, youShare));
  const oppShare = 100-youShare;
  const win = youShare > 50;
  G.lastResult = { triviaScore, win, youShare, oppShare };
  if(win) G.electionsWon++; else G.electionsLost++;
  renderHud(); footerLinks.innerHTML='';
  const raceLabel = raceLabelFor(G.office, G.country, G.stateObj);
  card.innerHTML = `
    <div class="eyebrow"><span>🗳️ ELECTION NIGHT</span><span>${raceLabel.toUpperCase()}</span></div>
    <h2 class="title">Results are in</h2>
    <div class="weight-note">${weightNote(G.office)}</div>
    <div class="tally-wrap" id="tallyWrap">${tallyRowHTML('YOU', 'you')}${tallyRowHTML('OPPONENT', 'opp')}</div>
    <div class="stat-row">
      <div class="stat-box"><div class="label">Trivia score</div><div class="value">${Math.round(triviaScore)}%</div></div>
      <div class="stat-box"><div class="label">Experience bonus</div><div class="value">+${Math.round(expBonus)}</div></div>
      <div class="stat-box"><div class="label">Correct answers</div><div class="value">${G.correct}/${G.questions.length}</div></div>
    </div>
    <div id="resultBannerWrap"></div>
    <div class="btn-grid" id="postResultActions"></div>
  `;
  animateTally(Math.round(youShare), Math.round(oppShare), ()=>{
    document.getElementById('resultBannerWrap').innerHTML = `<div class="result-banner ${win?'win':'lose'}">${win?'🎉 Victory!':'💔 Defeat'}</div>`;
    if(win) fireConfetti();
    renderPostResultActions(win);
  });
}
function tallyRowHTML(name, cls){
  return `<div class="tally-row"><div class="tally-name">${name}</div><div class="flap-set" id="flap-${cls}">${flapDigitsHTML(0)}</div><span class="pct-sign">%</span><div class="bar-track"><div class="bar-fill ${cls}" id="bar-${cls}" style="width:0%"></div></div></div>`;
}
function flapDigitsHTML(n){ const s = String(n).padStart(2,'0'); return `<div class="flap">${s[0]}</div><div class="flap">${s[1]}</div>`; }
function setFlap(cls, n){ const wrap = document.getElementById('flap-'+cls); const s = String(n).padStart(2,'0'); wrap.innerHTML = `<div class="flap flip">${s[0]}</div><div class="flap flip">${s[1]}</div>`; }
function animateTally(youTarget, oppTarget, done){
  let step=0; const steps=20;
  const timer = setInterval(()=>{
    step++;
    const y = Math.min(Math.round((youTarget/steps)*step),youTarget);
    const o = Math.min(Math.round((oppTarget/steps)*step),oppTarget);
    setFlap('you', y); setFlap('opp', o);
    document.getElementById('bar-you').style.width = y+'%';
    document.getElementById('bar-opp').style.width = o+'%';
    if(step>=steps){ clearInterval(timer); done && done(); }
  }, 45);
}
function renderPostResultActions(win){
  const wrap = document.getElementById('postResultActions');
  if(win){ wrap.innerHTML = `<button class="btn gold" onclick="startOfficeTerm()">🏛️ Take office →</button>`; }
  else { wrap.innerHTML = `<button class="btn" onclick="retryElection()">🔁 Run again next cycle</button><button class="btn outline" onclick="fullRestart()">Start a new career</button>`; }
}
function retryElection(){ startElection(G.office, G.stateObj); }

/* ---------- In office: incidents (factual trivia tied to a scenario) ---------- */
function buildIncident(row){
  const [scenario, question, correct, wrongs, hard, explain] = row;
  const q = mkQ(question, correct, wrongs, 'Incident', !!hard);
  return { scenario, ...q, explain };
}
function startOfficeTerm(){
  const rows = incidentBankFor(G.office, G.country);
  G.incidentQueue = sampleN(rows,3).map(buildIncident);
  G.incidentIndex = 0; G.incidentGains = 0;
  renderHud(); screenIncident();
}
function screenIncident(){
  renderHud();
  const total = G.incidentQueue.length;
  const inc = G.incidentQueue[G.incidentIndex];
  const letters = ['A','B','C','D'];
  card.innerHTML = `
    <div class="eyebrow"><span>${officeLabel(G.office,G.country).toUpperCase()} · TERM ${G.term}</span><span>INCIDENT ${G.incidentIndex+1}/${total}</span></div>
    <span class="incident-tag">📰 In Office</span> ${inc.hard?'<span class="hard-tag">🔥 Hard</span>':''}
    <div class="scenario-box">${inc.scenario}</div>
    <div class="question-text">${inc.q}</div>
    <div class="choices" id="incidentChoices">
      ${inc.choices.map((c,i)=>`<button class="choice" data-i="${i}" onclick="answerIncident(${i})"><span class="letter">${letters[i]}</span><span>${c}</span></button>`).join('')}
    </div>
    <div id="incidentFeedback"></div>
  `;
}
function answerIncident(i){
  const inc = G.incidentQueue[G.incidentIndex];
  const buttons = document.querySelectorAll('#incidentChoices .choice');
  buttons.forEach(b=>b.disabled=true);
  const correctI = inc.answer;
  buttons[correctI].classList.add('correct');
  if(i!==correctI) buttons[i].classList.add('wrong');
  const isRight = i===correctI;
  const gain = isRight ? (inc.hard?22:15) : 0;
  G.experience = Math.max(0, Math.min(100, G.experience + gain));
  G.incidentGains += gain;
  renderHud();
  document.getElementById('incidentFeedback').innerHTML = `
    <div class="feedback-banner">${isRight?'✅ Correct — you handled it knowledgeably.':'❌ Not quite. Correct answer: '+inc.choices[correctI]} <b>(${gain>=0?'+':''}${gain} experience)</b><br>${inc.explain}</div>
    <div class="xp-track"><div class="xp-fill" style="width:${G.experience}%"></div></div>
    <div class="next-row"><button class="btn gold" style="display:inline-flex;width:auto;" onclick="nextIncident()">${G.incidentIndex+1<G.incidentQueue.length?'Next incident →':'End of term →'}</button></div>
  `;
}
function nextIncident(){
  G.incidentIndex++;
  if(G.incidentIndex>=G.incidentQueue.length){ screenCrisis(); } else { screenIncident(); }
}

/* ---------- End-of-term crisis: a judgment call with no single right answer ---------- */
function crisisBankFor(tier, country){
  const bank = country==='us' ? CRISIS_US : CRISIS_NG;
  return (bank && bank[tier]) || [];
}
function screenCrisis(){
  const bank = crisisBankFor(G.office, G.country);
  if(bank.length===0){ screenTermSummary(); return; }
  G.currentCrisis = pick(bank);
  renderHud();
  const letters = ['A','B','C'];
  card.innerHTML = `
    <div class="eyebrow"><span>${officeLabel(G.office,G.country).toUpperCase()} · TERM ${G.term}</span><span>⚡ CRISIS</span></div>
    <span class="incident-tag">🚨 Judgment call</span>
    <div class="scenario-box">${G.currentCrisis.scenario}</div>
    <p class="lede" style="margin-top:-6px;font-size:14px;">There's no single correct answer here — how you choose shapes your record, not just your score.</p>
    <div class="choices" id="crisisChoices">
      ${G.currentCrisis.choices.map((c,i)=>`<button class="choice" data-i="${i}" onclick="answerCrisis(${i})"><span class="letter">${letters[i]}</span><span>${c.label}</span></button>`).join('')}
    </div>
    <div id="crisisFeedback"></div>
  `;
}
function answerCrisis(i){
  const choice = G.currentCrisis.choices[i];
  document.querySelectorAll('#crisisChoices .choice').forEach((b,idx)=>{ b.disabled=true; if(idx===i) b.classList.add('chosen'); });
  G.experience = Math.max(0, Math.min(100, G.experience + choice.exp));
  G.incidentGains += choice.exp;
  renderHud();
  document.getElementById('crisisFeedback').innerHTML = `
    <div class="feedback-banner">${choice.outcome} <b>(${choice.exp>=0?'+':''}${choice.exp} experience)</b></div>
    <div class="xp-track"><div class="xp-fill" style="width:${G.experience}%"></div></div>
    <div class="next-row"><button class="btn gold" style="display:inline-flex;width:auto;" onclick="screenTermSummary()">End of term →</button></div>
  `;
}

/* ---------- End of term: re-run, promote, or retire ---------- */
function screenTermSummary(){
  renderHud();
  const canPromote = G.office!=='president';
  const nextTier = canPromote ? nextTierOf(G.office) : null;
  card.innerHTML = `
    <div class="eyebrow"><span>${officeLabel(G.office,G.country).toUpperCase()}</span><span>END OF TERM ${G.term}</span></div>
    <h2 class="title">📋 Term complete</h2>
    <p class="lede">Your grasp of ${G.incidentQueue.length} governance questions — and the judgment call you made under pressure — shaped your record in office.</p>
    <div class="stat-row">
      <div class="stat-box"><div class="label">Term experience gained</div><div class="value">${G.incidentGains>=0?'+':''}${G.incidentGains}</div></div>
      <div class="stat-box"><div class="label">Total experience</div><div class="value">${G.experience}</div></div>
    </div>
    <h2 class="title" style="font-size:19px;margin-top:22px;">What's next?</h2>
    <div class="btn-grid">
      <button class="btn gold" onclick="runAgainSameOffice()">🔁 Run for re-election as ${officeLabel(G.office,G.country)} <small>Experience carries into your score</small></button>
      ${canPromote ? `<button class="btn" onclick="runForHigherOffice()">🎖️ Run for ${officeLabel(nextTier,G.country)} <small>Trivia counts for less up here — lean on experience</small></button>` : ''}
      <button class="btn outline" onclick="retireCareer()">🏁 Retire <small>End your career and see your legacy</small></button>
    </div>
  `;
}
function runAgainSameOffice(){ G.term++; tierIntroThenStart(G.office, G.stateObj); }
function runForHigherOffice(){
  const next = nextTierOf(G.office);
  G.office = next; G.term = 1;
  if(next==='president'){ tierIntroThenStart('president', null); }
  else { screenStatePick(); }
}
function computeBadges(){
  const badges = [];
  if(G.country==='ng' && G.lga){
    const isFCT = G.stateObj && G.stateObj.name==='Federal Capital Territory';
    badges.push(`🏘️ Served ${G.lga}${isFCT?'':', '+G.stateObj.name} — one of Nigeria's 774 LGAs`);
  }
  if(G.office==='president') badges.push('🎖️ Reached the highest office in the land');
  else if(G.office==='governor') badges.push('🏛️ Rose to Governor');
  else badges.push('🌱 Built a career from the grassroots up');
  if(G.electionsWon>=3) badges.push(`🗳️ Won ${G.electionsWon} elections in office`);
  if(G.electionsLost>=1 && G.electionsWon>=1) badges.push('💪 Came back from at least one defeat');
  if(G.experience>=90) badges.push('🌟 Near-perfect governance record');
  else if(G.experience<=15) badges.push('🎲 Led on instinct more than expertise');
  return badges;
}
function retireCareer(){
  renderHud(); footerLinks.innerHTML='';
  const rank = G.experience>=80 ? 'Statesman of the People' : G.experience>=50 ? 'Respected Public Servant' : G.experience>=20 ? 'Steady Hand' : 'Career Politician';
  const officeStr = officeLabel(G.office,G.country) + (G.stateObj && G.office!=='president' ? ' of '+(G.office==='local'?localityOf(G.country,G.stateObj,G.lga)+', '+G.stateObj.name:G.stateObj.name) : (G.office==='president'?' of '+countryLabel():''));
  const badges = computeBadges();
  card.innerHTML = `
    <div class="eyebrow"><span>🏁 CAREER RETROSPECTIVE</span><span>${countryFlag()} ${countryLabel().toUpperCase()}</span></div>
    <h2 class="title">Thank you for your service</h2>
    <p class="lede">You leave office as ${officeStr} after ${G.term} term${G.term>1?'s':''}, remembered as a <b>${rank}</b>.</p>
    <div class="stat-row">
      <div class="stat-box"><div class="label">Final experience score</div><div class="value">${G.experience}</div></div>
      <div class="stat-box"><div class="label">Highest office</div><div class="value" style="font-size:17px;">${officeLabel(G.office,G.country)}</div></div>
      <div class="stat-box"><div class="label">Elections won</div><div class="value">${G.electionsWon}</div></div>
      <div class="stat-box"><div class="label">Elections lost</div><div class="value">${G.electionsLost}</div></div>
    </div>
    ${badges.length ? `<h2 class="title" style="font-size:17px;margin-top:8px;">🏅 Legacy</h2><div class="btn-grid" style="margin-bottom:18px;">${badges.map(b=>`<div class="weight-note" style="margin:0;">${b}</div>`).join('')}</div>` : ''}
    <div class="btn-grid"><button class="btn gold" onclick="fullRestart()">🔄 Start a new career</button></div>
  `;
}

/* ============================================================================
   11. CONFETTI + INIT
   ============================================================================ */
const confettiCanvas = document.getElementById('confetti');
const ctx = confettiCanvas.getContext('2d');
function resizeConfetti(){ confettiCanvas.width=window.innerWidth; confettiCanvas.height=window.innerHeight; }
window.addEventListener('resize', resizeConfetti); resizeConfetti();
function fireConfetti(){
  const colors = ['#C9A227','#e0bb45','#2F6E5B','#F2ECDD','#B23A2F'];
  const pieces = Array.from({length:120}, ()=>({ x: Math.random()*confettiCanvas.width, y: -20-Math.random()*200, vx: (Math.random()-0.5)*3, vy: 2+Math.random()*3, size: 4+Math.random()*5, color: colors[Math.floor(Math.random()*colors.length)], rot: Math.random()*360, vr: (Math.random()-0.5)*10 }));
  let frame=0;
  function tick(){
    ctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
    frame++; let alive=false;
    pieces.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      if(p.y<confettiCanvas.height+20) alive=true;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180); ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6); ctx.restore();
    });
    if(alive && frame<220) requestAnimationFrame(tick); else ctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
  }
  tick();
}

screenMenu();
</script>
